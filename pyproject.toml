[project]
name = "sqlakit-example"
version = "0.1.0"
description = "A shop on SQLite, with every kind of SQLAKit template and macro."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "sqlakit>=0.22.1",
    "sqlalchemy>=2.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "sqruff>=0.40.0",
    "ty>=0.0.84",
    "poethepoet>=0.48.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
sqlakit = true
filterwarnings = ["error"]

[tool.ruff]
include = ["app/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # copyright notice in every file
    "D1", # docstrings are not mandatory
    "D203", # incompatible with D211
    "D213", # incompatible with D212
    "E501", # line length is enforced by the formatter
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "D401", # docstrings say what a function gives, not what it does
    "DTZ001", # SQLite keeps timestamps without a zone, and so does the shop
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # tests assert
    "PLR2004",  # and compare against the values they mean
    "INP001",   # tests are not a package
]

[tool.sqruff.core]
dialect = "sqlite"
templater = "placeholder"
rules = "all"
exclude_rules = "RF01,RF02,RF03,AL05,ST03"

[tool.sqruff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqruff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.sqruff.rules.capitalisation.types]
extended_capitalisation_policy = "upper"

[tool.sqruff.templater.placeholder]
param_style = "colon"

[tool.poe.tasks.fmt]
help = "Format and auto-fix the Python and the SQL"
sequence = ["ruff format", "ruff check --fix", "sqruff fix app"]
default_item_type = "cmd"

[tool.poe.tasks.lint]
help = "Lint the Python and the templates"
sequence = [
    "ruff format --check",
    "ruff check",
    "ty check",
    "sqlakit check",
    "sqlakit export sqruff --check",
    "sqruff lint app",
]
default_item_type = "cmd"

[tool.poe.tasks.test]
help = "Run the tests"
cmd = "pytest"
